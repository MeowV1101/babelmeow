[project]
name = "babelmeow"
version = "0.1.0"
description = "Universal game translation overlay - Thai-first, open to all languages"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "MeowV1101" }]
keywords = ["translation", "game", "overlay", "thai", "i18n", "diablo4"]

dependencies = [
    "requests>=2.32",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
bridge = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "rapidfuzz>=3.0",
]
extract = [
    # Tools for game asset extraction (placeholder)
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "rapidfuzz>=3.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["babelmeow"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
